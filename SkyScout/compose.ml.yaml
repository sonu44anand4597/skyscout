# Optional inference overlay. Supply an evaluated artifact before enabling.
# docker compose -f compose.yaml -f compose.ml.yaml up -d --build
services:
  api:
    environment:
      ML_SERVICE_URL: http://ml:8001
  worker:
    environment:
      ML_SERVICE_URL: http://ml:8001
  ml:
    build:
      context: .
      dockerfile: ml/Dockerfile
    volumes:
      - ${SKYSCOUT_MODEL_DIR:-./ml/artifacts}:/app/ml/artifacts:ro
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
